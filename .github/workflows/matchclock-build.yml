name: MatchClock Kotlin Build
run-name: MatchClock Kotlin v1.0.0

on:
  push:
    branches:
      - build/matchclock-kotlin-v100-20260821
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Restore and verify Kotlin project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work source dist diagnostics
          cat matchclock-build/project/part-*.b64 | tr -d '\n\r\t ' | base64 -d > work/project.zip
          echo "29bde0576721a77bd9ed57146ea904b6a7db29ddeb42e92ebb5dc1c224069595  work/project.zip" | sha256sum -c -
          unzip -t work/project.zip
          unzip -q work/project.zip -d source
          SETTINGS="$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)"
          test -n "$SETTINGS"
          PROJECT_ROOT="$(dirname "$SETTINGS")"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          test -f "$PROJECT_ROOT/app/build.gradle.kts" -o -f "$PROJECT_ROOT/app/build.gradle"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_ROOT"
          gradle --no-daemon --console=plain --stacktrace --warning-mode all :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/diagnostics/gradle-build.log"

      - name: Collect and verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_ROOT/app/build/outputs/apk" -type f -name '*debug*.apk' | head -n 1)"
          test -n "$APK"
          FINAL="$GITHUB_WORKSPACE/dist/MatchClock-v1.0.0.apk"
          cp "$APK" "$FINAL"
          BT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/36.0.0"
          "$BT/apksigner" verify --verbose --print-certs "$FINAL" | tee "$GITHUB_WORKSPACE/dist/signature-report.txt"
          sha256sum "$FINAL" | tee "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt"
          "$BT/aapt" dump badging "$FINAL" | tee "$GITHUB_WORKSPACE/dist/apk-info.txt"
          unzip -t "$FINAL" > "$GITHUB_WORKSPACE/dist/zip-integrity.txt"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: MatchClock-v1.0.0-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: MatchClock-v1.0.0-build-log
          path: diagnostics/*
          if-no-files-found: warn
          retention-days: 7

