name: MatchClock APK CI V6

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Apply v1.3.0 UI fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('matchclock-native/app/src/main/java/com/aborayan/matchclock/SmartRefereeActivity.kt')
          s = p.read_text(encoding='utf-8')
          def repl(pattern, replacement, label):
              global s
              s2,n = re.subn(pattern,replacement,s,flags=re.MULTILINE)
              if n != 1: raise SystemExit(f'{label}: {n}')
              s=s2
          repl(r'^    private fun iconButton\(.*$', '''    private fun iconButton(res: Int, content: String, tint: Int = ink(), fill: Int = surface2(), size: Int = 46, onClick: () -> Unit) = ImageButton(this).apply { setImageResource(res); drawable?.mutate()?.setTint(tint); background=shape(fill,14,if(fill==surface2()) line() else null); contentDescription=content; scaleType=ImageView.ScaleType.CENTER_INSIDE; adjustViewBounds=false; val pad=if(size<=40)8 else 10; setPadding(dp(pad),dp(pad),dp(pad),dp(pad)); setOnClickListener{onClick()}; minimumWidth=0;minimumHeight=0 }''', 'iconButton')
          repl(r'^    private fun actionButton\(.*$', '''    private fun actionButton(label:String,icon:Int,fill:Int,color:Int=Color.WHITE,height:Int=56,onClick:()->Unit)=Button(this).apply{ text=latin(label);isAllCaps=false;textSize=if(compact)13f else 14f;setTextColor(color);setTypeface(typeface,Typeface.BOLD);gravity=Gravity.CENTER;textAlignment=View.TEXT_ALIGNMENT_CENTER;background=shape(fill,16,if(fill==surface2())line()else null);minHeight=dp(height);minimumHeight=dp(height);minWidth=0;minimumWidth=0;maxLines=1;setAutoSizeTextTypeUniformWithConfiguration(10,if(compact)13 else 14,1,android.util.TypedValue.COMPLEX_UNIT_SP);compoundDrawablePadding=dp(4);setCompoundDrawablesRelative(drawable(icon,color,if(compact)19 else 21),null,null,null);setPadding(dp(5),0,dp(5),0);setOnClickListener{onClick()} }''', 'actionButton')
          repl(r'^    private fun scoreBoard\(s:MatchState\):View\{.*$', '''    private fun scoreBoard(s:MatchState):View{val outer=row(4).apply{setPadding(dp(7),dp(6),dp(7),dp(6));background=shape(surface2(),18);clipChildren=true;clipToPadding=true};outer.addView(teamScoreBox(s,true),LinearLayout.LayoutParams(0,-1,1f));outer.addView(text(":",if(compact)25f else 28f,muted(),true).apply{gravity=Gravity.CENTER},LinearLayout.LayoutParams(dp(if(compact)14 else 18),-1));outer.addView(teamScoreBox(s,false),LinearLayout.LayoutParams(0,-1,1f));return outer}''', 'scoreBoard')
          repl(r'^    private fun teamScoreBox\(s:MatchState,home:Boolean\):View\{.*$', '''    private fun teamScoreBox(s:MatchState,home:Boolean):View{val teamColor=if(home)green else blue;val teamSoft=if(dark){if(home)0xFF143422.toInt() else 0xFF112C42.toInt()}else{if(home)0xFFEAF6EE.toInt() else 0xFFEAF3FB.toInt()};val box=col().apply{gravity=Gravity.CENTER;setPadding(dp(4),dp(3),dp(4),dp(4));background=shape(teamSoft,14,teamColor)};val teamName=text(if(home)s.home else s.away,if(compact)16f else 18f,teamColor,true).apply{gravity=Gravity.CENTER;maxLines=1;textAlignment=View.TEXT_ALIGNMENT_CENTER;setAutoSizeTextTypeUniformWithConfiguration(if(compact)13 else 14,if(compact)17 else 20,1,android.util.TypedValue.COMPLEX_UNIT_SP);setPadding(dp(2),0,dp(2),0)};box.addView(teamName,LinearLayout.LayoutParams(-1,dp(if(compact)25 else 29)));val r=row(4).apply{gravity=Gravity.CENTER;clipChildren=true;clipToPadding=true};val minus=iconButton(R.drawable.ic_minus_smart,"إنقاص",teamColor,surface(),if(compact)36 else 40){if(home)s.scoreHome=(s.scoreHome-1).coerceAtLeast(0) else s.scoreAway=(s.scoreAway-1).coerceAtLeast(0);save();renderActive();renderSelector()};val score=text((if(home)s.scoreHome else s.scoreAway).toString(),if(compact)30f else 36f,teamColor,true).apply{gravity=Gravity.CENTER;textAlignment=View.TEXT_ALIGNMENT_CENTER;typeface=Typeface.MONOSPACE;textLocale=java.util.Locale.US};val plus=iconButton(R.drawable.ic_add_smart,"زيادة",Color.WHITE,teamColor,if(compact)36 else 40){if(home)s.scoreHome++ else s.scoreAway++;save();renderActive();renderSelector()};r.addView(minus,LinearLayout.LayoutParams(0,-1,1f));r.addView(score,LinearLayout.LayoutParams(0,-1,1.12f));r.addView(plus,LinearLayout.LayoutParams(0,-1,1f));box.addView(r,LinearLayout.LayoutParams(-1,0,1f));return box}''', 'teamScoreBox')
          repl(r'^    private fun clock\(ms:Long,tenth:Boolean=false\):String\{.*$', '''    private fun clock(ms:Long,tenth:Boolean=false):String{val safe=ms.coerceAtLeast(0);val total=safe/1000;val m=total/60;val sec=total%60;return if(tenth)String.format(java.util.Locale.US,"%02d:%02d.%d",m,sec,(safe%1000)/100) else String.format(java.util.Locale.US,"%02d:%02d",m,sec)}''', 'clock')
          s=s.replace('coerceAtLeast(0)else ', 'coerceAtLeast(0) else ')
          s=s.replace('put("version","1.2.0")','put("version","1.3.0")')
          p.write_text(s,encoding='utf-8')
          g=Path('matchclock-native/app/build.gradle.kts')
          x=g.read_text(encoding='utf-8').replace('versionCode = 3','versionCode = 4').replace('versionName = "1.2.0"','versionName = "1.3.0"')
          if 'versionCode = 4' not in x or 'versionName = "1.3.0"' not in x: raise SystemExit('version patch failed')
          g.write_text(x,encoding='utf-8')
          PY

      - name: Verify requested changes
        run: |
          grep -q 'versionName = "1.3.0"' matchclock-native/app/build.gradle.kts
          grep -q 'String.format(java.util.Locale.US' matchclock-native/app/src/main/java/com/aborayan/matchclock/SmartRefereeActivity.kt
          grep -q 'teamColor=if(home)green else blue' matchclock-native/app/src/main/java/com/aborayan/matchclock/SmartRefereeActivity.kt
          grep -q 'r.addView(plus,LinearLayout.LayoutParams(0,-1,1f))' matchclock-native/app/src/main/java/com/aborayan/matchclock/SmartRefereeActivity.kt
          ! grep -q 'coerceAtLeast(0)else ' matchclock-native/app/src/main/java/com/aborayan/matchclock/SmartRefereeActivity.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: gradle -p matchclock-native :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          mkdir -p verified
          cp matchclock-native/app/build/outputs/apk/debug/app-debug.apk verified/MatchClock-v1.3.0.apk
          unzip -t verified/MatchClock-v1.3.0.apk > verified/zip-integrity.txt
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs verified/MatchClock-v1.3.0.apk > verified/signature-report.txt
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging verified/MatchClock-v1.3.0.apk > verified/apk-info.txt
          sha256sum verified/MatchClock-v1.3.0.apk > verified/SHA256SUMS.txt
          grep -q "package: name='com.aborayan.matchclock' versionCode='4' versionName='1.3.0'" verified/apk-info.txt
          grep -q "launchable-activity: name='com.aborayan.matchclock.SmartRefereeActivity'" verified/apk-info.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MatchClock-v1.3.0-APK-V6
          path: verified/
          if-no-files-found: error
          retention-days: 7
