name: MatchClock APK CI V7

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Apply v1.4.0 modern UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('matchclock-native/app/src/main/java/com/aborayan/matchclock/SmartRefereeActivity.kt')
          s = p.read_text(encoding='utf-8')

          def repl(name, code):
              global s
              pattern = rf'^    private fun {re.escape(name)}\(.*$'
              s2, n = re.subn(pattern, code.rstrip(), s, count=1, flags=re.MULTILINE)
              if n != 1:
                  raise SystemExit(f'function {name}: matched {n}')
              s = s2

          s = s.replace(
              '    private var liveStatus: TextView? = null',
              '    private var liveStatus: TextView? = null\n'
              '    private var livePhase: TextView? = null\n'
              '    private lateinit var bottomNav: LinearLayout\n'
              '    private var screenMode: String = "match"\n'
              '    private var matchFilter: String = "all"'
          )
          s = s.replace(
              '    private val red = 0xFFC94343.toInt()',
              '    private val red = 0xFFC94343.toInt()\n'
              '    private val navy = 0xFF071827.toInt()\n'
              '    private val orange = 0xFFF07C19.toInt()'
          )

          repl('iconButton', r'''    private fun iconButton(res: Int, content: String, tint: Int = ink(), fill: Int = surface2(), size: Int = 46, onClick: () -> Unit) = ImageButton(this).apply {
        setImageResource(res)
        drawable?.mutate()?.setTint(tint)
        background = shape(fill, 14, if (fill == surface2()) line() else null)
        contentDescription = content
        scaleType = ImageView.ScaleType.CENTER_INSIDE
        adjustViewBounds = false
        val pad = if (size <= 40) 8 else 10
        setPadding(dp(pad), dp(pad), dp(pad), dp(pad))
        setOnClickListener { onClick() }
        minimumWidth = 0; minimumHeight = 0
    }''')

          repl('actionButton', r'''    private fun actionButton(label:String,icon:Int,fill:Int,color:Int=Color.WHITE,height:Int=56,onClick:()->Unit)=Button(this).apply{
        text=latin(label); isAllCaps=false; textSize=if(compact)12.5f else 14f
        setTextColor(color); setTypeface(typeface,Typeface.BOLD); gravity=Gravity.CENTER
        textAlignment=View.TEXT_ALIGNMENT_CENTER; background=shape(fill,15,if(fill==surface2())line()else null)
        minHeight=dp(height); minimumHeight=dp(height); minWidth=0; minimumWidth=0; maxLines=1
        setAutoSizeTextTypeUniformWithConfiguration(10,if(compact)13 else 14,1,android.util.TypedValue.COMPLEX_UNIT_SP)
        compoundDrawablePadding=dp(4); setCompoundDrawablesRelative(drawable(icon,color,if(compact)18 else 21),null,null,null)
        setPadding(dp(5),0,dp(5),0); setOnClickListener{onClick()}
    }''')

          repl('buildUi', r'''    private fun buildUi(){
        window.statusBarColor=navy; window.navigationBarColor=navy
        @Suppress("DEPRECATION") window.decorView.systemUiVisibility=0
        root=col().apply{layoutDirection=View.LAYOUT_DIRECTION_RTL;setBackgroundColor(bg());setPadding(dp(8),dp(6),dp(8),0)}
        applyInsets(root)
        contentHost=FrameLayout(this)
        root.addView(contentHost,LinearLayout.LayoutParams(-1,0,1f))
        bottomNav=bottomNavigation()
        root.addView(bottomNav,LinearLayout.LayoutParams(-1,dp(if(compact)58 else 64)).apply{topMargin=dp(5)})
        setContentView(root)
        renderActive()
    }''')

          repl('renderActive', r'''    private fun renderActive(){
        liveTime=null; liveLost=null; liveShot=null; liveStatus=null; livePhase=null
        contentHost.removeAllViews()
        val view=when(screenMode){
            "matches"->matchesScreen()
            "modes"->modesScreen()
            "log"->globalLogScreen()
            "settings"->appSettingsScreen()
            else->{
                val st=states.firstOrNull{it.id==selectedId&&!it.archived} ?: states.firstOrNull{!it.archived}
                if(st!=null){selectedId=st.id;when(st.type){MatchState.TYPE_SHOOTOUT->shootoutPanel(st);MatchState.TYPE_SETS->setsPanel(st);MatchState.TYPE_BASKETBALL->basketPanel(st);else->matchPanel(st)}}
                else emptyModernScreen()
            }
        }
        contentHost.addView(view,FrameLayout.LayoutParams(-1,-1))
        if(::bottomNav.isInitialized){root.removeView(bottomNav);bottomNav=bottomNavigation();root.addView(bottomNav,LinearLayout.LayoutParams(-1,dp(if(compact)58 else 64)).apply{topMargin=dp(5)})}
        updateLive()
    }''')

