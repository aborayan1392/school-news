        homeBtn.text=latin(s.home);awayBtn.text=latin(s.away);homeBtn.setOnClickListener{team="home";styleTeam()};awayBtn.setOnClickListener{team="away";styleTeam()};styleTeam();teamRow.addView(weight(homeBtn));teamRow.addView(weight(awayBtn));body.addView(teamRow)
