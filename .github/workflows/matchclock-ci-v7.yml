          repl('teamScoreBox', r'''    private fun teamScoreBox(s:MatchState,home:Boolean):View{val teamColor=if(home)green else blue;val teamSoft=if(dark){if(home)0xFF143422.toInt() else 0xFF112C42.toInt()}else{if(home)0xFFEAF6EE.toInt() else 0xFFEAF3FB.toInt()};val box=col().apply{gravity=Gravity.CENTER;setPadding(dp(4),dp(3),dp(4),dp(4));background=shape(teamSoft,14,teamColor)};val teamName=text(if(home)s.home else s.away,if(compact)16f else 18f,teamColor,true).apply{gravity=Gravity.CENTER;maxLines=1;textAlignment=View.TEXT_ALIGNMENT_CENTER;setAutoSizeTextTypeUniformWithConfiguration(if(compact)13 else 14,if(compact)17 else 20,1,android.util.TypedValue.COMPLEX_UNIT_SP)};box.addView(teamName,LinearLayout.LayoutParams(-1,dp(if(compact)25 else 29)));val r=row(4).apply{gravity=Gravity.CENTER;clipChildren=true;clipToPadding=true};val minus=iconButton(R.drawable.ic_minus_smart,"إنقاص",teamColor,surface(),if(compact)36 else 40){if(home)s.scoreHome=(s.scoreHome-1).coerceAtLeast(0) else s.scoreAway=(s.scoreAway-1).coerceAtLeast(0);save();renderActive()};val score=text((if(home)s.scoreHome else s.scoreAway).toString(),if(compact)30f else 36f,teamColor,true).apply{gravity=Gravity.CENTER;textAlignment=View.TEXT_ALIGNMENT_CENTER;typeface=Typeface.MONOSPACE;textLocale=java.util.Locale.US};val plus=iconButton(R.drawable.ic_add_smart,"زيادة",Color.WHITE,teamColor,if(compact)36 else 40){if(home)s.scoreHome++ else s.scoreAway++;save();renderActive()};r.addView(minus,LinearLayout.LayoutParams(0,-1,1f));r.addView(score,LinearLayout.LayoutParams(0,-1,1.12f));r.addView(plus,LinearLayout.LayoutParams(0,-1,1f));box.addView(r,LinearLayout.LayoutParams(-1,0,1f));return box}''')

