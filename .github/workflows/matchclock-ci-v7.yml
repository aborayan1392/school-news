        val ctl=row(7).apply{setPadding(dp(8),0,dp(8),0)}
        ctl.addView(weight(actionButton("إعادة",R.drawable.ic_reset_smart,surface2(),ink(),if(compact)47 else 52){showResetDialog(s)}))
