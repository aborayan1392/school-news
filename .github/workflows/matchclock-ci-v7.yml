        ev.addView(weight(actionButton("هدف",R.drawable.ic_goal,green,Color.WHITE,if(compact)49 else 54){showEventDialog(s,"goal")}))
        card.addView(ev)
        card.addView(recentEventsBox(s),LinearLayout.LayoutParams(-1,0,0.82f).apply{setMargins(dp(8),dp(7),dp(8),dp(7))})
