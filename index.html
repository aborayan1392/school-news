<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أخبار المدرسة</title>
<meta name="description" content="آخر الأخبار والإعلانات المدرسية">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="board-header">
  <div class="wrap">
    <div class="brand">
      <div class="brand-badge">📌</div>
      <div>
        <h1>أخبار المدرسة</h1>
        <p>كل جديد عن مدرستنا في مكان واحد</p>
      </div>
    </div>
    <div class="header-meta"><span class="dot"></span><span id="today-date">—</span></div>
  </div>
</header>

<main class="page">
  <div class="toolbar">
    <input type="search" id="search-input" placeholder="ابحث في الأخبار…">
    <div class="chip-row" id="category-chips">
      <button class="chip active" data-cat="الكل">الكل</button>
    </div>
  </div>

  <div class="news-grid" id="news-grid"></div>

  <div class="empty-state" id="empty-state" style="display:none;">
    <div class="icon">🗞️</div>
    <p>لا توجد أخبار مطابقة حالياً.</p>
  </div>
</main>

<footer class="site-footer">
  إدارة المحتوى؟ <a href="admin.html">اذهب إلى صفحة التحكم</a>
</footer>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <button class="close-btn" id="modal-close">✕</button>
    <img class="full" id="modal-img" style="display:none;">
    <span class="cat" id="modal-cat"></span>
    <h2 id="modal-title"></h2>
    <div class="date" id="modal-date"></div>
    <div class="body" id="modal-body"></div>
  </div>
</div>

<script>
const state = { all: [], category: 'الكل', query: '' };

function fmtDate(iso){
  try{
    return new Date(iso).toLocaleDateString('ar-EG', { year:'numeric', month:'long', day:'numeric' });
  }catch(e){ return iso; }
}

async function loadNews(){
  try{
    const res = await fetch('data/news.json?t=' + Date.now());
    if(!res.ok) throw new Error('تعذر تحميل الملف');
    const data = await res.json();
    state.all = Array.isArray(data) ? data.slice().sort((a,b)=> new Date(b.date) - new Date(a.date)) : [];
  }catch(e){
    state.all = [];
    console.error(e);
  }
  buildCategoryChips();
  render();
}

function buildCategoryChips(){
  const cats = ['الكل', ...new Set(state.all.map(n => n.category).filter(Boolean))];
  const wrap = document.getElementById('category-chips');
  wrap.innerHTML = '';
  cats.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'chip' + (cat === state.category ? ' active' : '');
    btn.textContent = cat;
    btn.dataset.cat = cat;
    btn.addEventListener('click', () => { state.category = cat; buildCategoryChips(); render(); });
    wrap.appendChild(btn);
  });
}

function render(){
  const grid = document.getElementById('news-grid');
  const empty = document.getElementById('empty-state');
  let items = state.all;
  if(state.category !== 'الكل') items = items.filter(n => n.category === state.category);
  if(state.query.trim()) {
    const q = state.query.trim().toLowerCase();
    items = items.filter(n => (n.title + ' ' + n.content).toLowerCase().includes(q));
  }

  grid.innerHTML = '';
  if(items.length === 0){ empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  items.forEach(n => {
    const card = document.createElement('article');
    card.className = 'news-card';
    card.innerHTML = `
      ${n.image ? `<img class="thumb" src="${escapeAttr(n.image)}" alt="">` : ''}
      <span class="cat">${escapeHtml(n.category || 'عام')}</span>
      <h3>${escapeHtml(n.title)}</h3>
      <p class="excerpt">${escapeHtml((n.content||'').slice(0,110))}${(n.content||'').length>110 ? '…' : ''}</p>
      <div class="meta"><span>${fmtDate(n.date)}${n.author ? ' • ' + escapeHtml(n.author) : ''}</span><span class="read-more">اقرأ المزيد ←</span></div>
    `;
    card.addEventListener('click', () => openModal(n));
    grid.appendChild(card);
  });
}

function openModal(n){
  document.getElementById('modal-cat').textContent = n.category || 'عام';
  document.getElementById('modal-title').textContent = n.title;
  document.getElementById('modal-date').textContent = fmtDate(n.date) + (n.author ? ' • ' + n.author : '');
  document.getElementById('modal-body').textContent = n.content;
  const img = document.getElementById('modal-img');
  if(n.image){ img.src = n.image; img.style.display = 'block'; } else { img.style.display = 'none'; }
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal(){ document.getElementById('modal-overlay').classList.remove('open'); }

function escapeHtml(s=''){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s=''){ return escapeHtml(s); }

document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', e => { if(e.target.id === 'modal-overlay') closeModal(); });
document.getElementById('search-input').addEventListener('input', e => { state.query = e.target.value; render(); });

document.getElementById('today-date').textContent = new Date().toLocaleDateString('ar-EG', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

loadNews();
</script>
</body>
</html>
